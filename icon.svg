<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Sam &amp; Oak restaurant logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3c995"/>
      <stop offset="0.5" stop-color="#b8935a"/>
      <stop offset="1" stop-color="#9a7743"/>
    </linearGradient>
    <path id="leaf" d="M0 0 C-8 -6 -16 -4 -14 -12 C-22 -12 -20 -22 -14 -24 C-24 -30 -14 -38 -10 -36 C-14 -46 -4 -50 0 -46 C4 -50 14 -46 10 -36 C14 -38 24 -30 14 -24 C20 -22 22 -12 14 -12 C16 -4 8 -6 0 0 Z"/>
  </defs>

  <!-- emblem -->
  <circle cx="200" cy="200" r="190" fill="#2b0d14"/>
  <circle cx="200" cy="200" r="178" fill="none" stroke="url(#brass)" stroke-width="2.5"/>
  <circle cx="200" cy="200" r="169" fill="none" stroke="url(#brass)" stroke-width="0.8"/>

  <!-- oak sprig + acorn -->
  <g transform="translate(0 14)">
    <g fill="url(#brass)">
      <use href="#leaf" transform="translate(200 104) rotate(-58) scale(1.25)"/>
      <use href="#leaf" transform="translate(200 104) rotate(58) scale(1.25)"/>
      <use href="#leaf" transform="translate(200 104) rotate(0) scale(1.05)"/>
    </g>
    <path d="M200 104 L200 118" stroke="url(#brass)" stroke-width="3.5" stroke-linecap="round"/>

    <!-- acorn cap -->
    <path d="M166 152 Q166 118 200 114 Q234 118 234 152 Z" fill="url(#brass)"/>
    <g stroke="#2b0d14" stroke-width="1.2" opacity="0.55" fill="none">
      <path d="M176 146 L184 138 L192 146 L200 138 L208 146 L216 138 L224 146"/>
      <path d="M172 134 L180 126 L188 134 L196 126 L204 134 L212 126 L220 134 L228 126"/>
    </g>

    <!-- acorn body -->
    <path d="M172 158 Q170 214 200 240 Q230 214 228 158 Z" fill="none" stroke="url(#brass)" stroke-width="3.5" stroke-linejoin="round"/>
    <path d="M186 176 Q184 204 198 222" fill="none" stroke="url(#brass)" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- wordmark -->
  <path d="M150 286 H250" stroke="url(#brass)" stroke-width="0.8"/>
  <text x="200" y="318" text-anchor="middle" font-family="'Cormorant Garamond', Georgia, 'Times New Roman', serif" font-size="38" font-weight="500" letter-spacing="7" fill="#f5efe4">SAM <tspan font-style="italic" font-weight="400" fill="#d9bd8a">&amp;</tspan> OAK</text>
  <text x="200" y="342" text-anchor="middle" font-family="'Hanken Grotesk', Helvetica, Arial, sans-serif" font-size="10.5" letter-spacing="6" fill="#b8935a">RESTAURANT</text>
</svg>